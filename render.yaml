# Evaluation deployment. Free Postgres expires after 30 days.
# Upgrade or migrate the database before using this as a permanent connector.
services:
  - type: web
    name: ai-village-open-chat
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: OWNER_ACCESS_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-village-open-chat-db
          property: connectionString
databases:
  - name: ai-village-open-chat-db
    databaseName: ai_village_open_chat
    user: ai_village_open_chat
    plan: free
    region: virginia
    ipAllowList: []
